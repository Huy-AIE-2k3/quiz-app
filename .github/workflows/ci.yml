name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI (Ruff & Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quiz_test
          POSTGRES_USER: quiz_user
          POSTGRES_PASSWORD: test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Run Ruff Lint
        working-directory: ./backend
        run: uv run ruff check .

      - name: Run Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://quiz_user:test_password_only@127.0.0.1:5432/quiz_test
          DATABASE_URL_DIRECT: postgresql://quiz_user:test_password_only@127.0.0.1:5432/quiz_test
          SECRET_KEY: test_ci_secret_key_minimum_32_characters_long
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: test-bucket
          S3_ACCESS_KEY: test_key
          S3_SECRET_KEY: test_secret
        run: uv run pytest

  frontend:
    name: Frontend CI (Lint, Test & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        working-directory: ./frontend
        run: pnpm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: pnpm run test

      - name: Build Production Assets
        working-directory: ./frontend
        run: pnpm run build

